
<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Style files and meta tags -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Valhalla</title>
    <script src="script.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="top-section">
            <div class="weapon-container">
                <div class="sword-container"><!-- Sword and its components -->
                    <div class="tip"></div>
                    <div class="blade"></div>
                    <div class="guard"></div>
                    <div class="guard-end-left"></div>
                    <div class="guard-end-right"></div>
                    <div class="hilt"></div>
                    <div class="pommel"></div>
                </div>
                <div class="shield-container"><!-- Shield and components -->
                    <div class="shield-body">
                        <div class="shield-star"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="bottom-section"> <!-- Subsection - Login form and Viking ship -->
            <div class="viking-ship">
                <div class="ship-body">
                    <div class="ship-shields">
                        <div class="shield"></div>
                        <div class="shield"></div>
                        <div class="shield"></div>
                        <div class="shield"></div>
                        <div class="shield"></div>
                        <div class="shield"></div>
                    </div>
                    <div class="ship-mast">
                        <div class="sail"></div>
                        <div class="flag"></div>
                    </div>
                </div>
                <div class="waves"></div>
            </div>
            <div class="login-container">
                <form class="login-form">
                    <h2>LOGIN</h2>
                    <div class="form-group">
                        <input type="text" placeholder="VIKING NAME" required>
                    </div>
                    <div class="form-group">
                        <input type="password" placeholder="Password" required>

                    </div>
                    <button type="submit">JOIN the Battle</button>
                </form>
            </div>
        </div>
    </div>
    <div id="clock" class="clock"></div>
</body>
</html>
