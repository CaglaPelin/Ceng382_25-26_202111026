<!-- prompts:
1)How can I use JavaScript to dynamically update the table with new class entries?
2)How can I use JavaScript to add a new class entry to the table when the form is submitted?
3)How can I make the form and table responsive for different screen sizes?
4)The table should include Class Name, Number of People, and Description columns.
There should be input fields where the user can enter data for these columns, along with an "Add Course" button.
-->

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Page</title>
    <link rel="stylesheet" href="tablecss.css">
</head>
<body class="table-page">
    <h1>Class Information</h1>
    
    <!-- Clock Display -->
    <div id="clock" style="text-align: center; font-size: 1.5rem; margin-bottom: 1rem;"></div>
    
    <!-- Class Information Input Form -->
    <form id="class-form">
        <div class="form-group">
            <label for="class-name">Class Name:</label>
            <input type="text" id="class-name" name="class-name" required>
        </div>
        <div class="form-group">
            <label for="number-of-people">Number of People:</label>
            <input type="number" id="number-of-people" name="number-of-people" required>
        </div>
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" required></textarea>
        </div>
        
        <button type="submit">Add Class</button>
    </form>
    
    <div class="table-container">
        <!-- Class Information Table -->
        <table id="class-table">
            <thead>
                <tr>
                    <th>Class Name</th>
                    <th>Number of People</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody>
                <!-- Class entries will be added here -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
